<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root { --bg:#060a13; --panel:rgba(12,18,32,.88); --line:#1c2742; --text:#d7e1f5; --muted:#7f8db0; --accent:#38bdf8; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px/1.4 "Segoe UI", system-ui, sans-serif; overflow:hidden; }
button, select, input { font:inherit; color:var(--text); background:#0f1830; border:1px solid var(--line); border-radius:5px; padding:4px 9px; }
button { cursor:pointer; } button:hover { border-color:var(--accent); } button.on { background:#123457; border-color:var(--accent); }
button.rec { border-color:#ff4d5e; color:#ff9aa4; } button.rec.on { background:#4a1119; }
#top { position:absolute; left:0; right:0; top:0; min-height:48px; display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:7px 12px;
       background:linear-gradient(#0b1224, rgba(11,18,36,.75)); border-bottom:1px solid var(--line); z-index:5; }
#top h1 { font-size:14px; margin:0 6px 0 0; font-weight:600; white-space:nowrap; max-width:280px; overflow:hidden; text-overflow:ellipsis; }
#top h1 b { color:var(--accent); }
#clock { font:600 13px Consolas, monospace; color:#fff; min-width:140px; text-align:center; }
.ctl { display:flex; gap:5px; align-items:center; color:var(--muted); white-space:nowrap; }
#stage { position:absolute; left:0; right:0; bottom:116px; }
#cv { position:absolute; left:0; top:0; width:100%; height:100%; display:block; }
.panel { position:absolute; background:var(--panel); border:1px solid var(--line); border-radius:8px; z-index:4; }
#hud { left:12px; width:214px; padding:10px 11px; }
#hud .big { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
#hud .big div { background:#0b1327; border:1px solid var(--line); border-radius:6px; padding:5px 7px; }
#hud .big b { display:block; font:700 16px Consolas, monospace; color:#fff; }
#hud .big span { color:var(--muted); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; }
h3 { margin:10px 0 5px; font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
.catrow { display:flex; align-items:center; gap:6px; margin:2px 0; cursor:pointer; user-select:none; }
.catrow i { width:9px; height:9px; border-radius:50%; flex:none; box-shadow:0 0 7px currentColor; }
.catrow .n { margin-left:auto; font-family:Consolas, monospace; color:#fff; }
.catrow.off { opacity:.35; }
#feedbox { right:12px; width:310px; padding:9px 11px; display:flex; flex-direction:column; }
#feed { overflow:hidden; font:11px Consolas, monospace; }
#feed div { padding:3px 0; border-bottom:1px solid #121c33; animation:fade .6s ease-out; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#feed .t { color:var(--muted); }
@keyframes fade { from { background:rgba(56,189,248,.18); } to { background:transparent; } }
.panel .hide { position:absolute; right:6px; top:5px; padding:0 6px; font-size:11px; }
#det { right:12px; width:450px; padding:12px 14px; z-index:6; overflow:auto; display:none; background:rgba(9,14,26,.97); }
#det h2 { margin:0 0 2px; font:600 14px Consolas, monospace; word-break:break-all; color:#fff; padding-right:30px; }
#det dl { display:grid; grid-template-columns:118px 1fr; gap:3px 10px; margin:8px 0; }
#det dt { color:var(--muted); } #det dd { margin:0; font-family:Consolas, monospace; }
.lv { display:inline-block; padding:1px 8px; border-radius:10px; font-weight:700; font-size:11px; }
.lv0 { background:#10284a; color:#7cc0ff; } .lv1 { background:#3b2a07; color:#f5c062; } .lv2 { background:#47121a; color:#ff8b96; }
.lv3 { background:#4a0f30; color:#ff7ab8; box-shadow:0 0 10px rgba(255,46,136,.5); }
.ph { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:4px; }
table.p { width:100%; border-collapse:collapse; font-size:11.5px; }
table.p td, table.p th { border-bottom:1px solid #16213b; padding:4px; vertical-align:top; text-align:left; }
table.p th { color:var(--muted); font-weight:500; }
table.p .v { font-family:Consolas, monospace; word-break:break-all; color:#e9f0ff; }
.muted { color:var(--muted); }
#tl { position:absolute; left:0; right:0; bottom:0; height:116px; background:rgba(8,12,24,.96); border-top:1px solid var(--line); z-index:5; }
#tl svg { width:100%; height:100%; cursor:crosshair; }
#about { left:12px; bottom:128px; width:430px; padding:12px 14px; z-index:6; display:none; background:rgba(9,14,26,.97); }
#about p { margin:6px 0; }
#tip { position:absolute; z-index:7; pointer-events:none; background:rgba(9,14,26,.95); border:1px solid var(--line); border-radius:6px;
       padding:5px 8px; font:11.5px Consolas, monospace; display:none; max-width:420px; }
#showhud, #showfeed { position:absolute; z-index:4; display:none; }
</style>
</head>
<body>
<div id="top">
  <h1><b>●</b> <span id="ttl"></span></h1>
  <button id="play">▶ Play</button><button id="back" title="previous attack">◀</button><button id="fwd" title="next attack">▶</button>
  <div id="clock"></div>
  <div class="ctl">step <select id="step"><option value="300">5 min</option><option value="900">15 min</option><option value="3600">1 hour</option><option value="86400">1 day</option></select></div>
  <div class="ctl">speed <select id="speed"><option value="0.5">0.5</option><option value="1">1</option><option value="2" selected>2</option><option value="4">4</option><option value="8">8</option><option value="16">16</option></select>steps/s</div>
  <div class="ctl"><select id="mode"><option value="cum">keep history</option><option value="live">active only</option></select></div>
  <div class="ctl"><button id="gsites" class="on">sites</button><button id="gpaths">paths</button></div>
  <div class="ctl">colour <select id="colour"><option value="phase">by phase</option><option value="cat">by attack type</option></select></div>
  <div class="ctl">level ≥ <select id="minlv"><option value="0">all</option><option value="1">enumeration</option><option value="2">extraction</option><option value="3">sustained</option></select></div>
  <div class="ctl"><input id="q" placeholder="filter address / site / path" style="width:170px"></div>
  <button id="recb" class="rec" title="Plays from the start and records the map to a video file">● Record video</button>
  <button id="aboutb">Levels?</button>
</div>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="hud" class="panel"><button class="hide" data-hide="hud">–</button>
  <div class="big"><div><b id="c-pay">0</b><span>payloads</span></div><div><b id="c-req">0</b><span>requests</span></div>
    <div><b id="c-src">0</b><span>sources</span></div><div><b id="c-act">0</b><span>active now</span></div></div>
  <h3>Attack types</h3><div id="cats"></div>
  <h3>Phase reached</h3><div id="phases"></div>
  <h3>Legend</h3>
  <div class="muted" style="font-size:11.5px">Arrow: attack in progress · comet: new payload · <span style="color:#ff3b5c">■ packets flowing back</span>: extraction payloads active (data requested back) · node colour: level</div>
</div>
<button id="showhud">▤ stats</button>
<div id="feedbox" class="panel"><button class="hide" data-hide="feedbox">–</button><h3 style="margin-top:0">Live feed</h3><div id="feed"></div></div>
<button id="showfeed">▤ feed</button>
<div id="det" class="panel"><button class="hide" id="detx">✕</button><div id="detc"></div></div>
<div id="about" class="panel"></div>
<div id="tip"></div>
<div id="tl"><svg id="tls"></svg></div>
<script>
const D = __DATA__;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PH = D.phase_rank, PHCOL = ['#3d9bff', '#f5b942', '#ff3b5c'], LVCOL = ['#3d9bff', '#f5b942', '#ff3b5c', '#ff2e88'];
const LEAK = '#ff3b5c', LVN = D.levels.map(l => l.name);
const catCol = c => (D.cats[c] || {}).color || '#9aa7c7', catLbl = c => (D.cats[c] || {}).label || c;
const fmt = t => new Date(t * 1000).toISOString().slice(0, 16).replace('T', ' ') + 'Z';
const units = new Map(D.units.map(u => [u.id, u]));
const EV = D.events.slice().sort((a, b) => a.t - b.t);
const T0 = EV.length ? EV[0].t : 0, T1 = EV.length ? EV[EV.length - 1].t : 0;
$('#ttl').textContent = D.title; $('#ttl').title = D.title;
const hiddenSrc = new Set(D.sources.filter(s => !s.shown).map(s => s.id));
const srcInfo = new Map(D.sources.map(s => [s.id, s])), siteInfo = new Map(D.sites.map(s => [s.id, s]));
const pairLv = new Map(D.pairs.map(p => [p.src + '\t' + p.site, p]));

// ------------------------------------------------------------------ filters and per-arc activity
const OTHER = '(other sources)';
const srcKey = e => hiddenSrc.has(e.src) ? OTHER : e.src;
const tgtKey = e => expanded.has(e.site) ? e.site + '\t' + e.path : e.site;
function visible(e) {

  const lv = +$('#minlv').value;
  if (lv) { const p = pairLv.get(e.src + '\t' + e.site); if (!p || p.level < lv) return false; }
  const q = $('#q').value.trim().toLowerCase();
  return !q || e.src.toLowerCase().includes(q) || e.site.toLowerCase().includes(q) || (e.path || '').toLowerCase().includes(q);

// An attack is "present" from a payload's first to its last time seen (repeats), bridged over short gaps.
let ARCS = new Map(), VEV = [];
function buildArcs() {

    return out.map(([a, b]) => [a, b + linger]); };
  m.forEach(a => { a.iv = merge(a.iv); a.leak = merge(a.leak); a.anim = {on: false, grow: 1, fade: 0, leakOn: false, leakFade: 0}; });

}
const inIv = (ivs, t) => ivs.some(([a, b]) => t >= a && t <= b);

// ------------------------------------------------------------------ layout (compact, measured labels)
const cv = $('#cv'), ctx = cv.getContext('2d');

const insets = () => ({l: $('#hud').style.display === 'none' ? 12 : 238,

  cv.width = W * DPR; cv.height = H * DPR;
  ['#hud', '#feedbox', '#det', '#showhud', '#showfeed'].forEach(s => { $(s).style.top = (th + 10) + 'px'; });
  $('#det').style.bottom = '128px'; $('#feedbox').style.maxHeight = (H - 30) + 'px';
  $('#showhud').style.left = '12px'; $('#showfeed').style.right = '12px';
  const srcs = new Map(), tg = new Map();
  for (const e of VEV) {
    const s = srcKey(e); if (!srcs.has(s)) srcs.set(s, e.t);
    if (!tg.has(e.site)) tg.set(e.site, {first: e.t, paths: new Map()});
    const p = tg.get(e.site).paths; if (!p.has(e.path)) p.set(e.path, e.t);
  }
  const rows = [];
  [...tg.entries()].sort((a, b) => a[1].first - b[1].first).forEach(([site, v]) => {
    if (expanded.has(site)) {
      rows.push({id: site + '\thead', kind: 'head', site, npaths: v.paths.size});
      [...v.paths.entries()].sort((a, b) => a[1] - b[1]).forEach(([p]) => rows.push({id: site + '\t' + p, kind: 'path', site, path: p}));
    } else rows.push({id: site, kind: 'site', site, npaths: v.paths.size});
  });
  const sl = [...srcs.entries()].sort((a, b) => a[1] - b[1]).map(([s]) => s);
  ctx.font = '600 12px Consolas, monospace';
  const lab = s => s === OTHER ? `${D.hidden_sources} other sources` : s;
  const srcLabW = Math.min(240, Math.max(60, ...sl.map(s => ctx.measureText(lab(s)).width)));
  const tgtLabW = Math.min(300, Math.max(80, ...rows.map(r => ctx.measureText(r.kind === 'path' ? r.path : r.site + (r.npaths > 1 ? `  (${r.npaths} paths)` : '')).width + (r.kind === 'path' ? 16 : 0))));
  const ins = insets(), avail = W - ins.l - ins.r;
  const span = Math.max(200, Math.min(600, avail - srcLabW - tgtLabW - 80));
  const used = srcLabW + 26 + span + 30 + tgtLabW;
  const x0 = ins.l + Math.max(0, (avail - used) / 2);
  const xs = x0 + srcLabW + 26, xt = xs + span;
  // fixed spacing for sites, tighter for paths; sources spread over the targets' height only when they are few
  const rh = r => r.kind === 'path' ? 22 : r.kind === 'head' ? 26 : 36;
  const tH = rows.reduce((h, r) => h + rh(r), 0);
  const sH = Math.max(sl.length * 24, Math.min(tH, sl.length * 56));
  const blockH = Math.max(tH, sH), top = Math.max(26, (H - blockH) / 2);
  const tgt = new Map(); let y = top + (blockH - tH) / 2;
  rows.forEach(r => { tgt.set(r.id, {...r, y: y + rh(r) / 2}); y += rh(r); });
  const sy = top + (blockH - sH) / 2, sstep = sl.length ? sH / sl.length : 0;
  const src = new Map(sl.map((s, i) => [s, sy + (i + .5) * sstep]));

  maxScroll = Math.max(0, top + blockH + 26 - H); scrollY = Math.min(scrollY, maxScroll);
}
cv.addEventListener('wheel', e => { if (!maxScroll) return; scrollY = Math.max(0, Math.min(maxScroll, scrollY + e.deltaY)); e.preventDefault(); }, {passive: false});
function arcGeo(a) {
  const y1 = L.src.get(a.s), r = L.tgt.get(a.t); if (y1 == null || !r) return null;
  const x1 = L.xs + 7, x2 = L.xt - 9, y2 = r.y, cx = (x1 + x2) / 2, cy = (y1 + y2) / 2 - Math.max(26, Math.abs(y2 - y1) * .15) - (x2 - x1) * .07;
  return {x1, y1, x2, y2, cx, cy};
}
const qpt = (g, k) => { const q = 1 - k; return [q * q * g.x1 + 2 * q * k * g.cx + k * k * g.x2, q * q * g.y1 + 2 * q * k * g.cy + k * k * g.y2]; };

function strokeArc(g, from, to, off) {
  ctx.beginPath();
  for (let i = 0; i <= 40; i++) {
    const k = from + (to - from) * i / 40; let [x, y] = qpt(g, k);
    if (off) { const [dx, dy] = qtan(g, k), n = Math.hypot(dx, dy) || 1; x += -dy / n * off; y += dx / n * off; }

// ------------------------------------------------------------------ what has happened up to the cursor
function stats() {
  const S = new Map(), T = new Map(), A = new Map(); let pay = new Set(), req = 0;
  const cats = new Map(), ph = [new Set(), new Set(), new Set()];
  for (const e of VEV) {
    if (e.t > cur) break;
    const s = srcKey(e), t = tgtKey(e), k = s + '\n' + t, r = PH[e.phase] ?? 0;
    const sn = S.get(s) || S.set(s, {n: new Set()}).get(s); sn.n.add(e.u);
    const tn = T.get(t) || T.set(t, {n: new Set()}).get(t); tn.n.add(e.u);
    const an = A.get(k) || A.set(k, {n: new Set(), max: 0, cats: new Map()}).get(k); an.n.add(e.u); an.max = Math.max(an.max, r);

  return {S, T, A, pay: pay.size, req, cats, ph, keepAll: $('#mode').value === 'cum'};
}
let ST = null;

// ------------------------------------------------------------------ frame
const shots = [];

function arcColour(a) {

    return best ? catCol(best) : catCol(a.ev[0].cat); }

function frame(now) {

    fire(prev, cur);
  }

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const bg = ctx.createRadialGradient(W / 2, H * .45, 40, W / 2, H * .45, Math.max(W, H) * .7);
  bg.addColorStop(0, '#0d1931'); bg.addColorStop(1, '#060a13'); ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  ARCS.forEach(a => {
    const g = arcGeo(a); if (!g) return;
    const on = inIv(a.iv, cur), started = a.iv.length && a.iv[0][0] <= cur, an = a.anim;
    if (on && !an.on) { an.on = true; an.grow = playing ? 0 : 1; }

    if (an.on) { active++; activeSrc.add(a.s); activeTgt.add(a.t); an.grow = Math.min(1, an.grow + dt / .7); }

    const col = arcColour(a), selA = sel && sel.type === 'arc' && sel.s === a.s && sel.t === a.t, hov = hover && hover.k === a.k;

      const st = ST.A.get(a.k), w = 1.6 + Math.min(5, Math.log2(1 + (st ? st.n.size : 1)) * 1.1);
      ctx.globalAlpha = alpha * .3; ctx.strokeStyle = col; ctx.lineWidth = w * 3.4; ctx.shadowColor = col; ctx.shadowBlur = 18; strokeArc(g, 0, reach);

      ctx.setLineDash([3, 14]); ctx.lineDashOffset = -now / 28; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(1.2, w * .45);

      ctx.globalAlpha = alpha; ctx.fillStyle = col; ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.moveTo(hx + Math.cos(ang) * s * .6, hy + Math.sin(ang) * s * .6);
      ctx.lineTo(hx + Math.cos(ang + 2.5) * s, hy + Math.sin(ang + 2.5) * s); ctx.lineTo(hx + Math.cos(ang - 2.5) * s, hy + Math.sin(ang - 2.5) * s); ctx.fill();
      if (an.on && an.grow >= 1) { const ph = (now / 1100 + a.k.length * .37) % 1; ctx.strokeStyle = col; ctx.lineWidth = 1.5;
        ctx.globalAlpha = (1 - ph) * .7; ctx.beginPath(); ctx.arc(g.x2, g.y2, 6 + ph * 22, 0, 7); ctx.stroke(); }

    an.leakOn = leakOn;
    if (!leakOn) an.leakFade = Math.max(0, an.leakFade - dt / 1.6);
    const la = leakOn ? Math.min(1, an.grow * 1.2) : an.leakFade;
    if (la > 0) {
      ctx.globalAlpha = la * .3; ctx.strokeStyle = LEAK; ctx.lineWidth = 7; ctx.shadowColor = LEAK; ctx.shadowBlur = 16; strokeArc(g, 0, 1, 9); ctx.shadowBlur = 0;

        const k = 1 - (((now / 1600) + i / 10) % 1);

// ------------------------------------------------------------------ timeline
let TL = null;
function drawTimeline() {
  const svg = $('#tls'), Wt = svg.clientWidth || innerWidth, Ht = 116, padL = 46, padR = 16, top = 10, bot = 22;
  const bin = Math.max(3600, STEP), b0 = Math.floor(T0 / bin) * bin, nb = Math.max(1, Math.floor((T1 - b0) / bin) + 1);

  const tot = stacks.map(m => [...m.values()].reduce((a, s) => a + s.size, 0)), mx = Math.max(1, ...tot);
  const x = t => padL + (t - b0) / (nb * bin) * (Wt - padL - padR), bw = Math.max(1, (Wt - padL - padR) / nb - .5);
  let h = '';

    const hh = n / mx * (Ht - top - bot); y -= hh; h += `<rect x="${x(b0 + i * bin).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" fill="${catCol(c)}" opacity=".85"/>`; }); });

    h += `<line x1="${x(d)}" x2="${x(d)}" y1="${top}" y2="${Ht - bot}" stroke="#1c2742"/><text x="${x(d) + 3}" y="${Ht - 7}" fill="#7f8db0" font-size="11">${fmt(d).slice(5, 10)}</text>`;
  h += `<text x="5" y="${top + 9}" fill="#7f8db0" font-size="11">${mx}</text><text x="5" y="${Ht - 7}" fill="#7f8db0" font-size="10">payloads/${bin >= 86400 ? 'day' : 'h'}</text>`;

// ------------------------------------------------------------------ hit testing, hover, details
function hit(mx, my) {
  my += scrollY;
  let best = null, bd = 10;
  L.src.forEach((y, s) => { if (Math.abs(my - y) < 9 && mx > L.xs - 220 && mx < L.xs + 10) { const d = Math.abs(my - y); if (d < bd) { bd = d; best = {type: 'src', id: s}; } } });
  L.tgt.forEach((r, id) => { if (Math.abs(my - r.y) < 10 && mx > L.xt - 24 && mx < L.xt + 320)
    best = r.kind === 'head' ? {type: 'head', site: r.site} : r.kind === 'path' ? {type: 'path', site: r.site, path: r.path, id} : {type: 'site', id: r.site, plus: mx < L.xt - 8}; });

    for (let i = 0; i <= 30; i++) { const [x, y] = qpt(g, i / 30), d = Math.hypot(mx - x, my - y); if (d < bad) { bad = d; ba = {type: 'arc', s: a.s, t: a.t, k: a.k}; } } });

}

});

cv.addEventListener('click', e => {

  h += `<h3>Payloads, in order</h3><table class="p"><tr><th>First seen</th><th>Phase</th><th>Payload</th></tr>` +
    [...us.values()].sort((a, b) => a.t - b.t).slice(0, 300).map(x => `<tr><td class="muted" style="white-space:nowrap">${fmt(x.t).slice(5)}<br>${x.n} req · ${esc((x.u.statuses || []).join(','))}</td>

  h += `<div class="muted" style="margin-top:10px">Levels describe what the payloads show; they don't establish that an attack succeeded.</div>`;
  $('#detc').innerHTML = h; $('#det').style.display = 'block'; $('#feedbox').style.visibility = 'hidden'; layout();
}

  `<p class="muted">Computed per source + site and per source + path from Payload Analyzer's categories and phases. Each distinct payload counts once at its first-seen time; an attack is drawn as in progress from a payload's first to its last time seen. Packets flowing back mark active extraction payloads: data was requested back, which does not establish that it was returned.</p>
   <p class="muted">Sites: click for details, double-click or + to expand into paths; "paths" expands all. Scroll the map when it is taller than the window.</p>`;
